name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'rust/**'
      - '.github/workflows/android_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'rust/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'
      
      - name: Export ANDROID_NDK_HOME for cargo-ndk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          NDK_DIR="$SDK_ROOT/ndk/25.2.9519653"
          if [ ! -d "$NDK_DIR" ]; then
            echo "NDK directory missing: $NDK_DIR"
            echo "Contents of $SDK_ROOT/ndk:"
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK_DIR"
      
      - name: Build Rust library
        working-directory: rust
        run: cargo ndk -t arm64-v8a build --release --features android
      
      - name: Copy native library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libterminal_core.so \
             android/app/src/main/jniLibs/arm64-v8a/
      
      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew
      
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
