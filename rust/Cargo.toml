[package]
name = "terminal_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Cross-platform terminal emulator core"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]  # Android uses cdylib, iOS uses staticlib

[dependencies]
# POSIX PTY (posix_openpt). Compiles for Linux and Android.
libc = "0.2"

# ANSI parsing
vte = "0.13"

# JNI (optional on host for `cargo check --features android`)
jni = { version = "0.21", optional = true }

# Serialization for checkpointing
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Logging
log = "0.4"

# Error handling
thiserror = "1.0"

# When cross-compiling for Android, always pull in JNI so a `cargo ndk`
# build that forgets `--features android` still exports Java_ methods.
# Host `cargo test` (target_os = linux) is unaffected.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
# Default is intentionally empty. `cargo build` / `cargo test` with no flags
# compiles and tests the platform-independent core (PTY, terminal, VFS logic,
# capability system) on a plain host toolchain — no Android NDK, no `jni`
# crate, no JVM required. This is the fast loop for local dev / Cursor.
#
# Use `--features android` to additionally compile the JNI boundary
# (jni_safe's JNIEnv-dependent half, android_jni.rs, vfs/android_saf.rs).
# That code can only be meaningfully *run* on-device, but `cargo check
# --features android` verifies it still type-checks against the real `jni`
# crate so a signature drift doesn't rot silently until someone builds an APK.
default = []
android = ["jni"]
ios = []

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Remove debug symbols
panic = "abort"      # Smaller binary

[profile.dev]
opt-level = 0
