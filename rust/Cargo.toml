[package]
name = "terminal_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Cross-platform terminal emulator core"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]  # Android uses cdylib, iOS uses staticlib

[dependencies]
# PTY handling
portable-pty = "0.8"

# ANSI parsing
vte = "0.13"

# JNI (Android only)
jni = { version = "0.21", optional = true }

# Serialization for checkpointing
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Database for caching
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "io-util"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[features]
default = ["android"]
android = ["jni"]
ios = []

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Remove debug symbols
panic = "abort"      # Smaller binary

[profile.dev]
opt-level = 0